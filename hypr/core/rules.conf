# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Make ghostty windows slightly transparent 
windowrule {
    name = ghostty-semi-transparent
    match:class = com.mitchellh.ghostty
    opacity = 0.85 0.75 1.0
}

# Make TUI's launched slightly transparent, floating, and centered to active display
windowrule {
    name = tui-transparent-focus-active
    match:class = xyz.changeling.*
    float = on
    center = on
    opacity = 0.85 0.75 1.0
    size = (monitor_w*.66666) (monitor_h*.66666)
}

layerrule {
    name = vicinae-blur
    blur = on
    ignore_alpha = 0
    match:namespace = vicinae
}

